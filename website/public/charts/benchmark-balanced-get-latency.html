const SERIES=[
  {index:2,label:'p50',stroke:'#1f242b',width:1.4,dash:''},
  {index:1,label:'avg',stroke:'#90979f',width:1.2,dash:'2 3'},
  {index:4,label:'p99.9',stroke:'#c3c7cc',width:1.6,dash:''},
  {index:3,label:'p99',stroke:'#6b7280',width:1.7,dash:''}
];
const MEASUREMENT_SECONDS=900.045;
const svg=document.getElementById('chart');
const tip=document.getElementById('tip');
const W=780,H=380,ML=64,MR=30,MT=26,MB=54;
const PW=W-ML-MR,PH=H-MT-MB;
const xMax=DATA[DATA.length-1][0];
const peak=Math.max(...DATA.flatMap(point=>point.slice(1)));
function niceStep(value,count){
  const raw=value/count;
  const power=Math.pow(10,Math.floor(Math.log10(raw)));
  const fraction=raw/power;
  const nice=fraction<=1?1:fraction<=2?2:fraction<=5?5:10;
  return nice*power;
}
const yStep=niceStep(peak*1.05,6);
const yMax=Math.ceil(peak/yStep)*yStep;
const x=v=>ML+(v/xMax)*PW;
const y=v=>MT+PH-(v/yMax)*PH;
const fmt=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const parts=[];

for(let value=0;value<=yMax+Number.EPSILON;value+=yStep){
  const py=y(value);
  parts.push('<line x1="'+ML+'" y1="'+py+'" x2="'+(ML+PW)+'" y2="'+py+'" stroke="var(--grid)" stroke-dasharray="2 3"/>');
  parts.push('<text x="'+(ML-9)+'" y="'+(py+4)+'" text-anchor="end" font-size="11" fill="var(--soft)">'+fmt.format(value)+'</text>');
}
for(const value of [0,150,300,450,600,750,900]){
  const px=x(value);
  parts.push('<text x="'+px+'" y="'+(MT+PH+20)+'" text-anchor="middle" font-size="11" fill="var(--soft)">'+fmt.format(value)+'</text>');
}
parts.push('<text transform="translate(15,'+(MT+PH/2)+') rotate(-90)" text-anchor="middle" font-size="12" font-weight="700">ms</text>');
parts.push('<text x="'+(ML+PW/2)+'" y="'+(MT+PH+42)+'" text-anchor="middle" font-size="12" font-weight="700">elapsed (s)</text>');

for(const series of SERIES){
  const path=DATA.map((point,index)=>(index?'L':'M')+x(point[0]).toFixed(2)+','+y(point[series.index]).toFixed(2)).join(' ');
  parts.push('<path d="'+path+'" fill="none" stroke="'+series.stroke+'" stroke-width="'+series.width+'"'+(series.dash?' stroke-dasharray="'+series.dash+'"':'')+' stroke-linejoin="round"/>');
}
parts.push('<g id="hover" style="display:none"><line id="hover-line" y1="'+MT+'" y2="'+(MT+PH)+'" stroke="var(--soft)" stroke-dasharray="3 3"/></g>');
parts.push('<rect id="hit" x="'+ML+'" y="'+MT+'" width="'+PW+'" height="'+PH+'" fill="transparent"/>');
svg.insertAdjacentHTML('beforeend',parts.join(''));

const hover=document.getElementById('hover');
const hoverLine=document.getElementById('hover-line');
for(const series of SERIES){
  const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('r','3');
  dot.setAttribute('fill','#fff');
  dot.setAttribute('stroke',series.stroke);
  dot.setAttribute('stroke-width','1.4');
  dot.dataset.index=series.index;
  hover.appendChild(dot);
}
const hit=document.getElementById('hit');

hit.addEventListener('mousemove',event=>{
  const bounds=svg.getBoundingClientRect();
  const viewX=(event.clientX-bounds.left)/bounds.width*W;
  const seconds=Math.max(0,Math.min(xMax,(viewX-ML)/PW*xMax));
  let nearest=0;
  for(let i=1;i<DATA.length;i+=1){
    if(Math.abs(DATA[i][0]-seconds)<Math.abs(DATA[nearest][0]-seconds)) nearest=i;
  }
  const point=DATA[nearest];
  const px=x(point[0]);
  hover.style.display='';
  hoverLine.setAttribute('x1',px);
  hoverLine.setAttribute('x2',px);
  hover.querySelectorAll('circle').forEach(dot=>{
    dot.setAttribute('cx',px);
    dot.setAttribute('cy',y(point[Number(dot.dataset.index)]));
  });
  const phase=point[0]<=MEASUREMENT_SECONDS?'measurement':'drain';
  tip.innerHTML=fmt.format(point[0])+'s · '+phase+'<br>'+
    'avg '+fmt.format(point[1])+' ms · p50 '+fmt.format(point[2])+' ms<br>'+
    'p99 '+fmt.format(point[3])+' ms · p99.9 '+fmt.format(point[4])+' ms';
  tip.style.opacity='1';
  const pad=8;
  const width=tip.offsetWidth;
  const height=tip.offsetHeight;
  let left=event.clientX+14;
  if(left+width>innerWidth-pad) left=event.clientX-14-width;
  tip.style.left=Math.max(pad,Math.min(left,innerWidth-pad-width))+'px';
  tip.style.top=Math.max(pad,Math.min(event.clientY-10,innerHeight-pad-height))+'px';
});
hit.addEventListener('mouseleave',()=>{
  hover.style.display='none';
  tip.style.opacity='0';
});

(function(){
  function postHeight(){
    let bottom=0;
    document.querySelectorAll('.chartbox').forEach(function(element){
      bottom=Math.max(bottom,element.getBoundingClientRect().bottom);
    });
    if(!bottom){
      const wrap=document.querySelector('.wrap');
      bottom=wrap?wrap.getBoundingClientRect().bottom:document.body.scrollHeight;
    }
    parent.postMessage({chartHeight:Math.ceil(bottom)+24},'*');
  }
  window.addEventListener('load',function(){requestAnimationFrame(postHeight)});
  window.addEventListener('resize',postHeight);
  setTimeout(postHeight,300);
  if(window.ResizeObserver)new ResizeObserver(postHeight).observe(document.documentElement);
})();
</script>
