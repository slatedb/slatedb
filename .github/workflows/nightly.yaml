name: Nightly

on:
  schedule:
    # Run at midnight Pacific (8 AM UTC)
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  detect-flaky-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.98
      - name: Install gdb
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
      - name: Run tests in a loop for 15 minutes
        run: |
          set -euo pipefail
          SECONDS=0
          deadline=$((15 * 60))
          iteration=1
          while [ $SECONDS -lt $deadline ]; do
            echo "=== Iteration $iteration (elapsed ${SECONDS}s) ==="
            if ! cargo nextest run --workspace --lib --all-features --all-targets --profile ci; then
              echo "Tests failed during iteration $iteration"
              exit 1
            fi
            iteration=$((iteration + 1))
          done
          completed=$((iteration - 1))
          echo "Completed $completed iteration(s) in ${SECONDS}s without failures"

  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl maven
          sudo snap install aws-cli --classic

      - name: Start chaos services (docker compose)
        run: |
          docker compose -f scripts/run_chaos_scenarios.compose.yaml up -d --wait

      - name: Configure S3 toxiproxy proxy
        run: |
          # Create s3 toxiproxy if not exist (TCP-level path only)
          curl -sf -X POST http://127.0.0.1:8474/proxies \
            -H 'Content-Type: application/json' \
            -d '{"name":"s3","listen":"0.0.0.0:9001","upstream":"localstack:4566"}' || true

      - name: Run chaos scenarios
        id: chaos
        env:
          SLATEDB_TEST_NUM_WRITERS: "2"
          SLATEDB_TEST_NUM_READERS: "2"
          SLATEDB_TEST_WRITES_PER_TASK: "250"
          SLATEDB_TEST_KEY_LENGTH: "256"
          RUST_BACKTRACE: "1"
        run: |
          chmod +x scripts/run_chaos_scenarios.sh
          if scripts/run_chaos_scenarios.sh; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Summarize results
        if: always()
        run: |
          echo "## 🌪️ SlateDB Toxiproxy Chaos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.chaos.outputs.ok }}" = "true" ]; then
            echo "All scenarios passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "One or more scenarios failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "--- Docker Compose PS ---"; docker compose -f scripts/run_chaos_scenarios.compose.yaml ps || true
          echo "--- LocalStack logs ---"; docker logs --tail 500 localstack || true
          echo "--- lowdown logs ---"; docker logs --tail 500 lowdown || true
          echo "--- Toxiproxy logs ---"; docker logs --tail 500 toxiproxy || true
          echo "--- Toxiproxy proxies ---"; curl -sf http://127.0.0.1:8474/proxies || true
